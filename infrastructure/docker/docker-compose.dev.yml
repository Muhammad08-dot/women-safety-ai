version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safety_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safety_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safety_secret_55}
      POSTGRES_DB: ${POSTGRES_DB:-women_safety_db}
    ports:
      - "5437:5432"

  redis:
    image: redis:7-alpine
    container_name: safety_redis
    restart: always
    ports:
      - "6384:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: safety_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8005:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-safety_user}:${POSTGRES_PASSWORD:-safety_secret_55}@postgres:5432/${POSTGRES_DB:-women_safety_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: safety_frontend
    restart: always
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8005/api/v1
    depends_on:
      - backend
